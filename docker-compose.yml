version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - genpact-prep/.env
    environment:
      - NODE_ENV=production
      # Fallback to local mongo container if MONGODB_URI is not provided in env/dotenv
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/prepwise}
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
